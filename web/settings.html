<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="CPA Key Model Access 设置">
  <title>模型权限 · CPA</title>
  <style nonce="{{NONCE}}">{{CSS}}</style>
</head>
<body>
  <main id="authGate" class="auth-shell">
    <section class="auth-card" aria-labelledby="authTitle">
      <div id="sessionIcon" class="session-icon" aria-hidden="true"></div>
      <h1 id="authTitle" data-i18n="session.connectingTitle">正在接入管理会话</h1>
      <p id="authMessage" class="auth-copy" role="status" aria-live="polite" data-i18n="session.readingMessage">正在读取 CPAMC 当前连接信息，无需再次输入 Management Key。</p>
      
      <div id="manualAuthSection" class="auth-form" hidden>
        <div class="form-field">
          <label for="manualKeyInput" data-i18n="session.keyLabel">Management Key</label>
          <input id="manualKeyInput" type="password" autocomplete="current-password" placeholder="请输入 CPA Management Key" data-i18n-placeholder="session.keyPlaceholder">
        </div>
        <div class="form-options">
          <label class="checkbox-label">
            <input id="rememberKeyCheckbox" type="checkbox" checked>
            <span data-i18n="session.rememberKey">在此浏览器记住 Key</span>
          </label>
        </div>
        <button id="manualConnectButton" class="button primary wide" type="button" data-i18n="session.connect">连接并进入设置</button>
      </div>

      <button id="retrySessionButton" class="button secondary wide" type="button" data-i18n="session.retry" hidden>重新读取会话</button>
      <p class="auth-footnote" data-i18n="session.footnote">支持自动复用 CPAMC 会话，或直接输入 Management Key 接入管理面板。</p>
    </section>
  </main>

  <div id="app" class="app" hidden>
    <div id="workspace" class="workspace">
      <aside class="sidebar" aria-label="策略导航" data-i18n-aria-label="nav.label">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M7.75 10.25V7.5a4.25 4.25 0 0 1 8.5 0v2.75M6.5 10.25h11a1.5 1.5 0 0 1 1.5 1.5v6.75a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 18.5v-6.75a1.5 1.5 0 0 1 1.5-1.5Z"/><path d="M12 14v2.25"/></svg>
          </span>
          <span class="brand-copy"><strong data-i18n="brand.title">模型权限</strong><span>Key Model Access</span></span>
        </div>
        <label class="search-field">
          <span id="searchIcon" aria-hidden="true"></span>
          <input id="searchInput" type="search" placeholder="搜索 Key" autocomplete="off" aria-label="搜索 Key" data-i18n-placeholder="nav.search" data-i18n-aria-label="nav.search">
        </label>
        <nav id="policyNav" class="policy-nav"></nav>
        <footer class="sidebar-foot">
          <div class="foot-row">
            <div id="healthBadge" class="health-badge"><span class="status-dot neutral"></span><span data-i18n="health.connecting">正在连接</span></div>
            <div class="foot-actions">
              <button id="reloadButton" class="icon-button" type="button" aria-label="从策略文件重载" title="从策略文件重载" data-i18n-aria-label="action.reload" data-i18n-title="action.reload"></button>
              <button id="refreshDataButton" class="icon-button" type="button" aria-label="刷新 CPA Key 与策略" title="刷新 CPA Key 与策略" data-i18n-aria-label="action.refresh" data-i18n-title="action.refresh"></button>
              <button id="logoutButton" class="icon-button" type="button" aria-label="退出会话" title="退出会话" data-i18n-aria-label="session.switchKey" data-i18n-title="session.switchKey"></button>
            </div>
          </div>
          <p id="persistenceNotice" class="persistence-notice"></p>
        </footer>
      </aside>

      <main class="main-stage">
        <section id="editor" class="editor" aria-live="polite"></section>
      </main>
    </div>

    <div class="command-wrap">
      <div id="saveBar" class="commandbar" role="region" aria-label="未保存的修改" data-i18n-aria-label="savebar.label" data-visible="false">
        <span class="status-dot warning" aria-hidden="true"></span>
        <span id="saveBarText" class="commandbar-text" data-i18n="savebar.text">有未保存的修改</span>
        <kbd class="shortcut" aria-hidden="true">⌘S</kbd>
        <button id="saveButton" class="button primary compact" type="button" disabled>保存</button>
      </div>
    </div>
  </div>

  <div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script nonce="{{NONCE}}">{{JS}}</script>
</body>
</html>
