# Merge this example into CLIProxyAPI's config.yaml.
# CPA's built-in provider owns and authenticates these raw API keys.
api-keys:
  - "replace-with-a-real-api-key"

plugins:
  enabled: true
  dir: "plugins"
  configs:
    key-model-access:
      enabled: true
      priority: 100

      # Safe default: use an inline, empty v3 document. Authenticated CPA keys
      # without a policy are allowed to use all interceptor-covered models.
      version: 3
      global_deny_models: []
      policies: []

      # Persistence is initialized automatically the first time the Web UI opens:
      # <plugins.dir>/key-model-access/config.toml is created, then this plugin
      # config is patched with policy_file through CPA's Management API.
      #
      # Optional explicit override (YAML and TOML are supported). The target must
      # already contain a valid v2/v3 policy document; a missing/invalid explicit
      # policy_file fails closed. Relative paths use CLIProxyAPI's working directory.
      # policy_file: "config/key-model-access-policies.yaml"
